version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agp
      POSTGRES_PASSWORD: agp
      POSTGRES_DB: agp
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agp"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"   # MCP server (agent-facing)
      - "9090:9090"   # Prometheus metrics
    environment:
      GATEWAY_MCP_PORT: "8080"
      GATEWAY_METRICS_PORT: "9090"
      REDIS_ADDR: "redis:6379"
      POSTGRES_DSN: "postgres://agp:agp@postgres:5432/agp?sslmode=disable"
      MCP_TARGETS: '{"default":"http://20.2.83.126:31200/mcp","bank-identity":"http://20.2.83.126:31100/mcp","bank-payments":"http://20.2.83.126:31200/mcp","bank-financial":"http://20.2.83.126:31300/mcp","bank-risk":"http://20.2.83.126:31400/mcp"}'
      GATEWAY_JWT_SECRET: "hackathon-demo-secret-2026"
      GATEWAY_JWT_ISSUER: "agp-gateway"
    networks:
      - frontend
      - backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: reflex-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:10.4.0
    container_name: reflex-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - backend
    restart: unless-stopped

networks:
  frontend:
  backend:

volumes:
  pgdata:
