# Compose file for Azure Container Apps (ACA).
# Deploy with:  az containerapp compose create
# ACA supports custom networks, ingress, scaling, and per-service config.
# For production, replace the in-stack postgres/redis with managed services
# (Azure Database for PostgreSQL + Azure Cache for Redis) so data persists.
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agp}
      POSTGRES_DB: agp
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.2-alpine

  backend:
    image: ${BACKEND_IMAGE:-reflex-backend:latest}
    environment:
      DATABASE_URL: "postgresql+asyncpg://agp:${POSTGRES_PASSWORD:-agp}@postgres:5432/agp"
      REDIS_URL: "redis://redis:6379/0"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      JWT_ISSUER: "${JWT_ISSUER:-agp-gateway}"
      FERNET_KEY: "${FERNET_KEY:?Set FERNET_KEY}"
      GATEWAY_URL: "http://gateway:8080"
      AGP_ENV: "${AGP_ENV:-production}"
      CORS_ORIGINS: "${CORS_ORIGINS:-*}"
    ports:
      - "8000:8000"

  gateway:
    image: ${GATEWAY_IMAGE:-reflex-gateway:latest}
    environment:
      GATEWAY_MCP_PORT: "8080"
      GATEWAY_METRICS_PORT: "9090"
      REDIS_ADDR: "redis:6379"
      POSTGRES_DSN: "postgres://agp:${POSTGRES_PASSWORD:-agp}@postgres:5432/agp?sslmode=disable"
      BACKEND_URL: "http://backend:8000"
      AGP_ENV: "${AGP_ENV:-production}"
      GATEWAY_JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET}"
      GATEWAY_JWT_ISSUER: "${JWT_ISSUER:-agp-gateway}"
    ports:
      - "8080:8080"   # MCP server (agent-facing)
      - "9090:9090"   # Prometheus metrics

  frontend:
    image: ${FRONTEND_IMAGE:-reflex-frontend:latest}
    environment:
      NODE_ENV: "production"
    ports:
      - "3000:3000"

volumes:
  pgdata:
