version: "2"
sql:
  - engine: "postgresql"
    schema: "../db/migrations/001_init.sql"
    queries: "db/queries/"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        overrides:
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "text"
            go_type: "string"
          - db_type: "bigint"
            go_type: "int64"
          - db_type: "varchar"
            go_type: "string"
